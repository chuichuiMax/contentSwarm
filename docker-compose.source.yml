x-api-worker-env: &api-worker-env
  HOST_IP: ${HOST_IP:-}
  LITE_MODE: ${LITE_MODE:-}
  RUNNING_IN_DOCKER: "true"
  YUXI_ENV: production
  PYTHONPATH: /app:/app/package
  PYTHONDONTWRITEBYTECODE: "1"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
  YUXI_INSTANCE_ID: ${YUXI_INSTANCE_ID:?YUXI_INSTANCE_ID must be set}
  POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-yuxi}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  RUN_CANCEL_KEY_TTL_SECONDS: ${RUN_CANCEL_KEY_TTL_SECONDS:-1800}
  RUN_EVENTS_STREAM_TTL_SECONDS: ${RUN_EVENTS_STREAM_TTL_SECONDS:-7200}
  NEO4J_URI: ${NEO4J_URI:-bolt://graph:7687}
  NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
  MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
  MILVUS_DB_NAME: ${MILVUS_DB_NAME:-default}
  MILVUS_TOKEN: ${MILVUS_TOKEN:-}
  MINERU_API_URI: ${MINERU_API_URI:-http://mineru-api:30001}
  PADDLEX_URI: ${PADDLEX_URI:-http://paddlex:8080}
  MINIO_URI: ${MINIO_URI:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
  MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-/boyun}
  SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-provisioner}
  SANDBOX_PROVISIONER_URL: ${SANDBOX_PROVISIONER_URL:-http://sandbox-provisioner:8002}
  SANDBOX_VIRTUAL_PATH_PREFIX: ${SANDBOX_VIRTUAL_PATH_PREFIX:-/home/gem/user-data}
  SANDBOX_EXEC_TIMEOUT_SECONDS: ${SANDBOX_EXEC_TIMEOUT_SECONDS:-180}
  SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-262144}
  IMAGE2_BASE_URL: ${IMAGE2_BASE_URL:-}
  IMAGE2_API_KEY: ${IMAGE2_API_KEY:-}
  IMAGE2_MODEL: ${IMAGE2_MODEL:-}
  IMAGE2_SUBMIT_PATH: ${IMAGE2_SUBMIT_PATH:-/images/generations}
  IMAGE2_STATUS_PATH: ${IMAGE2_STATUS_PATH:-/images/generations/{task_id}}
  IMAGE2_TIMEOUT_SECONDS: ${IMAGE2_TIMEOUT_SECONDS:-120}
  IMAGE2_POLL_INTERVAL_SECONDS: ${IMAGE2_POLL_INTERVAL_SECONDS:-2}
  IMAGE2_POLL_TIMEOUT_SECONDS: ${IMAGE2_POLL_TIMEOUT_SECONDS:-900}
  IMAGE2_MAX_CONCURRENT: ${IMAGE2_MAX_CONCURRENT:-1}
  IMAGE2_SEND_RESPONSE_FORMAT: ${IMAGE2_SEND_RESPONSE_FORMAT:-false}
  CONTENT_COVER_BUCKET: ${CONTENT_COVER_BUCKET:-content-covers}
  HYCANVAS_BASE_URL: ${HYCANVAS_BASE_URL:-http://hycanvas-app:8005}
  HYCANVAS_PUBLIC_URL: ${HYCANVAS_PUBLIC_URL:?HYCANVAS_PUBLIC_URL must be set}
  HYCANVAS_API_KEY: ${HYCANVAS_API_KEY:?HYCANVAS_API_KEY must be set}
  HYCANVAS_WORKSPACE_ID: ${HYCANVAS_WORKSPACE_ID:?HYCANVAS_WORKSPACE_ID must be set}
  XHS_RUNTIME_ROOT: ${XHS_RUNTIME_ROOT:-/app/saves/xiaohongshu}
  XHS_BROWSER_GATEWAY_URL: http://xhs-browser-gateway:5051
  XHS_GATEWAY_TOKEN: ${XHS_GATEWAY_TOKEN:?XHS_GATEWAY_TOKEN must be set to a random production secret}
  XHS_GATEWAY_HEADLESS: ${XHS_GATEWAY_HEADLESS:-true}
  XHS_GATEWAY_IDLE_SECONDS: ${XHS_GATEWAY_IDLE_SECONDS:-900}
  XHS_GATEWAY_REAPER_INTERVAL_SECONDS: ${XHS_GATEWAY_REAPER_INTERVAL_SECONDS:-30}
  XHS_GATEWAY_MAX_SESSIONS: ${XHS_GATEWAY_MAX_SESSIONS:-5}
  XHS_BROWSER_CONTROL_LEASE_SECONDS: ${XHS_BROWSER_CONTROL_LEASE_SECONDS:-120}
  XHS_BROWSER_OPERATION_LOCK_SECONDS: ${XHS_BROWSER_OPERATION_LOCK_SECONDS:-180}
  XHS_BROWSER_OPERATION_BLOCK_SECONDS: ${XHS_BROWSER_OPERATION_BLOCK_SECONDS:-3}
  NO_PROXY: localhost,127.0.0.1,milvus,graph,minio,milvus-etcd,etcd,mineru-api,paddlex,sandbox-provisioner,hycanvas-app
  no_proxy: localhost,127.0.0.1,milvus,graph,minio,milvus-etcd,etcd,mineru-api,paddlex,sandbox-provisioner,hycanvas-app

services:
  api:
    image: ${YUXI_API_RUNTIME_IMAGE:?YUXI_API_RUNTIME_IMAGE must be set}
    working_dir: /app
    networks: [app-network]
    volumes:
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/server:/app/server:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/package:/app/package:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/scripts:/app/scripts:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/uv.lock:/opt/source-locks/backend.uv.lock:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/package/uv.lock:/opt/source-locks/package.uv.lock:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/scripts/source-deploy:/opt/source-deploy:ro
      - ${DATA_ROOT:?DATA_ROOT must be set}/yuxi:/app/saves
      - ${DATA_ROOT:?DATA_ROOT must be set}/models:/app/models
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - ${CONFIG_ROOT:?CONFIG_ROOT must be set}/.env.config
    environment:
      <<: *api-worker-env
    command:
      - /bin/bash
      - -ec
      - |
        bash /opt/source-deploy/check-runtime-lock.sh verify /opt/runtime-locks/api.sha256 /opt/source-locks/backend.uv.lock /opt/source-locks/package.uv.lock
        exec uvicorn server.main:app --host 0.0.0.0 --port 5050
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050/api/system/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 180s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      sandbox-provisioner: {condition: service_healthy}
      hycanvas-init: {condition: service_completed_successfully}

  xhs-browser-gateway:
    image: ${YUXI_API_RUNTIME_IMAGE:?YUXI_API_RUNTIME_IMAGE must be set}
    working_dir: /app
    shm_size: ${XHS_GATEWAY_SHM_SIZE:-1gb}
    mem_limit: ${XHS_GATEWAY_MEMORY_LIMIT:-4g}
    networks: [app-network]
    volumes:
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/server:/app/server:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/package:/app/package:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/scripts:/app/scripts:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/uv.lock:/opt/source-locks/backend.uv.lock:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/package/uv.lock:/opt/source-locks/package.uv.lock:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/scripts/source-deploy:/opt/source-deploy:ro
      - ${DATA_ROOT:?DATA_ROOT must be set}/yuxi:/app/saves
      - ${DATA_ROOT:?DATA_ROOT must be set}/models:/app/models
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - ${CONFIG_ROOT:?CONFIG_ROOT must be set}/.env.config
    environment:
      <<: *api-worker-env
    command:
      - /bin/bash
      - -ec
      - |
        bash /opt/source-deploy/check-runtime-lock.sh verify /opt/runtime-locks/api.sha256 /opt/source-locks/backend.uv.lock /opt/source-locks/package.uv.lock
        exec uvicorn server.xhs_browser_gateway:app --host 0.0.0.0 --port 5051
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5051/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  worker:
    image: ${YUXI_API_RUNTIME_IMAGE:?YUXI_API_RUNTIME_IMAGE must be set}
    working_dir: /app
    networks: [app-network]
    volumes:
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/server:/app/server:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/package:/app/package:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/scripts:/app/scripts:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/uv.lock:/opt/source-locks/backend.uv.lock:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/backend/package/uv.lock:/opt/source-locks/package.uv.lock:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/scripts/source-deploy:/opt/source-deploy:ro
      - ${DATA_ROOT:?DATA_ROOT must be set}/yuxi:/app/saves
      - ${DATA_ROOT:?DATA_ROOT must be set}/models:/app/models
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - ${CONFIG_ROOT:?CONFIG_ROOT must be set}/.env.config
    environment:
      <<: *api-worker-env
    command:
      - /bin/bash
      - -ec
      - |
        bash /opt/source-deploy/check-runtime-lock.sh verify /opt/runtime-locks/api.sha256 /opt/source-locks/backend.uv.lock /opt/source-locks/package.uv.lock
        exec arq server.worker_main.WorkerSettings
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      sandbox-provisioner: {condition: service_healthy}
      xhs-browser-gateway: {condition: service_healthy}
      hycanvas-init: {condition: service_completed_successfully}

  sandbox-provisioner:
    image: ${YUXI_SANDBOX_RUNTIME_IMAGE:?YUXI_SANDBOX_RUNTIME_IMAGE must be set}
    working_dir: /app
    volumes:
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/docker/sandbox_provisioner/app.py:/app/app.py:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/docker/sandbox_provisioner/sandbox.env:/app/sandbox.env:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/docker/sandbox_provisioner/requirements.txt:/opt/source-locks/sandbox.requirements.txt:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/scripts/source-deploy:/opt/source-deploy:ro
      - ${DATA_ROOT:?DATA_ROOT must be set}/yuxi:/app/saves
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [app-network]
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      PROVISIONER_BACKEND: ${SANDBOX_PROVISIONER_BACKEND:-docker}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:?SANDBOX_IMAGE must use a versioned tag or digest}
      SANDBOX_CONTAINER_PORT: ${SANDBOX_CONTAINER_PORT:-8080}
      MEMORY_SANDBOX_URL_TEMPLATE: ${MEMORY_SANDBOX_URL_TEMPLATE:-http://agent-sandbox:8000}
      SANDBOX_HEALTH_TIMEOUT_SECONDS: ${SANDBOX_HEALTH_TIMEOUT_SECONDS:-300}
      SANDBOX_IDLE_TIMEOUT_SECONDS: ${SANDBOX_IDLE_TIMEOUT_SECONDS:-120}
      SANDBOX_IDLE_CHECK_INTERVAL_SECONDS: ${SANDBOX_IDLE_CHECK_INTERVAL_SECONDS:-10}
      SANDBOX_EXEC_TIMEOUT_SECONDS: ${SANDBOX_EXEC_TIMEOUT_SECONDS:-180}
      HTTP_PROXY: ${SANDBOX_HTTP_PROXY:-}
      HTTPS_PROXY: ${SANDBOX_HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,host.docker.internal
      DOCKER_NETWORK: ${SANDBOX_DOCKER_NETWORK:-contentswarm-source_app-network}
      DOCKER_THREADS_HOST_PATH: ${SANDBOX_DOCKER_THREADS_HOST_PATH:-}
      DOCKER_SANDBOX_PREFIX: ${SANDBOX_DOCKER_SANDBOX_PREFIX:-contentswarm-sandbox}
      DOCKER_SANDBOX_HOST: ${SANDBOX_DOCKER_SANDBOX_HOST:-host.docker.internal}
      K8S_NAMESPACE: ${SANDBOX_K8S_NAMESPACE:-contentswarm}
      NODE_HOST: ${SANDBOX_NODE_HOST:-host.docker.internal}
      KUBECONFIG_PATH: ${KUBECONFIG_PATH:-}
      THREAD_PVC: ${THREAD_PVC:-contentswarm-thread}
      SKILLS_PVC: ${SKILLS_PVC:-contentswarm-skills}
    command:
      - /bin/bash
      - -ec
      - |
        bash /opt/source-deploy/check-runtime-lock.sh verify /opt/runtime-locks/sandbox.sha256 /opt/source-locks/sandbox.requirements.txt
        exec uvicorn app:app --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  release-builder:
    image: ${RELEASE_BUILDER_IMAGE:?RELEASE_BUILDER_IMAGE must be set}
    profiles: [release]
    working_dir: /work
    environment:
      SOURCE_ROOT: /source
      RELEASE_ROOT: /releases
      CACHE_ROOT: /cache
      WORK_ROOT: /work/build
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/boyun/}
      CONTENTSWARM_PUBLIC_URL: ${CONTENTSWARM_PUBLIC_URL:?CONTENTSWARM_PUBLIC_URL must be set}
    volumes:
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}:/source:ro
      - ${RELEASE_ROOT:?RELEASE_ROOT must be set}:/releases
      - ${CACHE_ROOT:?CACHE_ROOT must be set}:/cache
    command: ["bash", "/source/scripts/source-deploy/build-release.sh"]
    restart: "no"

  web:
    image: ${NGINX_RUNTIME_IMAGE:-nginx:1.31.2-alpine@sha256:35cd77497979abe70dc8d26f5ae60811eea233a2eb5dc03c2ee30972caeb303e}
    ports:
      - ${WEB_HOST_PORT:-8090}:80
    depends_on:
      api: {condition: service_healthy}
    networks: [app-network]
    volumes:
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${RELEASE_ROOT:?RELEASE_ROOT must be set}/current/web-dist:/usr/share/nginx/html:ro
    command: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped

  hycanvas-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${HYCANVAS_DB_USER:-hycanvas}
      POSTGRES_PASSWORD: ${HYCANVAS_DB_PASSWORD:?HYCANVAS_DB_PASSWORD must be set}
      POSTGRES_DB: ${HYCANVAS_DB_NAME:-hycanvas}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/hycanvas-postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HYCANVAS_DB_USER:-hycanvas} -d ${HYCANVAS_DB_NAME:-hycanvas}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [app-network]
    restart: unless-stopped

  hycanvas-app:
    image: ${HYCANVAS_RUNTIME_IMAGE:?HYCANVAS_RUNTIME_IMAGE must be set}
    entrypoint: ["/app/hycanvas"]
    depends_on:
      hycanvas-db: {condition: service_healthy}
    environment:
      NODE_ENV: production
      PORT: "8005"
      DB_AUTO_MIGRATE: "true"
      DATABASE_URL: postgresql://${HYCANVAS_DB_USER:-hycanvas}:${HYCANVAS_DB_PASSWORD:?HYCANVAS_DB_PASSWORD must be set}@hycanvas-db:5432/${HYCANVAS_DB_NAME:-hycanvas}?schema=public
      JWT_SECRET: ${HYCANVAS_JWT_SECRET:?HYCANVAS_JWT_SECRET must be set}
      COOKIE_SECURE: ${HYCANVAS_COOKIE_SECURE:-false}
      REDIS_URL: ""
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/.data/storage
      HYCANVAS_AUTH_MODE: contentswarm
      CONTENTSWARM_URL: ${CONTENTSWARM_PUBLIC_URL:?CONTENTSWARM_PUBLIC_URL must be set}
    ports:
      - ${HYCANVAS_PORT:-8005}:8005
    volumes:
      - ${RELEASE_ROOT:?RELEASE_ROOT must be set}/current/hycanvas:/app/hycanvas:ro
      - ${DATA_ROOT:?DATA_ROOT must be set}/hycanvas:/app/.data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8005/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [app-network]
    restart: unless-stopped

  hycanvas-init:
    image: postgres:16
    depends_on:
      hycanvas-app: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://${HYCANVAS_DB_USER:-hycanvas}:${HYCANVAS_DB_PASSWORD:?HYCANVAS_DB_PASSWORD must be set}@hycanvas-db:5432/${HYCANVAS_DB_NAME:-hycanvas}
      HYCANVAS_API_KEY: ${HYCANVAS_API_KEY:?HYCANVAS_API_KEY must be set}
      HYCANVAS_WORKSPACE_ID: ${HYCANVAS_WORKSPACE_ID:?HYCANVAS_WORKSPACE_ID must be set}
    volumes:
      - ${SOURCE_ROOT:?SOURCE_ROOT must be set}/docker/hycanvas/init-integration.sh:/init-integration.sh:ro
    entrypoint: ["/bin/sh", "/init-integration.sh"]
    networks: [app-network]
    restart: "no"

  graph:
    image: neo4j:5.26
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/neo4j/data:/data
      - ${DATA_ROOT:?DATA_ROOT must be set}/neo4j/logs:/var/lib/neo4j/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=5 http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_listen__address: 0.0.0.0:7474
      ENTITY_EMBEDDING: "true"
    networks: [app-network]
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks: [app-network]
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/milvus/minio:/minio_data
      - ${DATA_ROOT:?DATA_ROOT must be set}/milvus/minio_config:/root/.minio
    command: minio server /minio_data --address 0.0.0.0:9000 --console-address 0.0.0.0:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks: [app-network]
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.6
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MILVUS_LOG_LEVEL: error
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/milvus/milvus:/var/lib/milvus
      - ${DATA_ROOT:?DATA_ROOT must be set}/milvus/logs:/var/lib/milvus/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 60s
      start_period: 120s
      timeout: 30s
      retries: 5
    depends_on: [etcd, minio]
    networks: [app-network]
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-yuxi}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yuxi} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [app-network]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/redis:/data
    networks: [app-network]
    restart: unless-stopped

  mineru-api:
    image: ${MINERU_IMAGE:-mineru-vllm:0.7.0}
    profiles: [all]
    env_file:
      - ${CONFIG_ROOT:?CONFIG_ROOT must be set}/.env.config
    ports:
      - ${MINERU_HOST_PORT:-30001}:30001
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-api
    command:
      - --host
      - 0.0.0.0
      - --port
      - "30001"
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30001/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks: [app-network]
    restart: unless-stopped

  paddlex:
    image: ${PADDLEX_IMAGE:-paddlex:0.7.0}
    profiles: [all]
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set}/paddlex:/paddlex
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks: [app-network]
    restart: unless-stopped

networks:
  app-network:
    name: ${APP_NETWORK_NAME:-contentswarm-source_app-network}
    driver: bridge
