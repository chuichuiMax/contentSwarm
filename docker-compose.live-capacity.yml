# 现网临时容量配置：与 docker-compose.yml 叠加使用
# docker compose -f docker-compose.yml -f docker-compose.live-capacity.yml up -d api web worker-dev worker-dev-2

services:
  api:
    command:
      - uv
      - run
      - --no-sync
      - --no-dev
      - uvicorn
      - server.main:app
      - --host
      - 0.0.0.0
      - --port
      - "5050"
      - --workers
      - "${API_UVICORN_WORKERS:-4}"

  web:
    image: nginx:1.31.2-alpine@sha256:35cd77497979abe70dc8d26f5ae60811eea233a2eb5dc03c2ee30972caeb303e
    build: !reset null
    volumes: !override
      - ./web/dist-live:/usr/share/nginx/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/static-spa.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !override
      - "5173:80"
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      api:
        condition: service_started

  worker-dev-2:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: yuxi-api:${YUXI_VERSION:-0.7.0}
    working_dir: /app
    volumes:
      - ./backend/server:/app/server
      - ./backend/package:/app/package
      - ./docker/volumes/yuxi:/app/saves
      - ./docker/volumes/models:/app/models
      - ./backend/test:/app/test
      - ./backend/scripts:/app/scripts
      - ./docker/sandbox_provisioner:/app/docker/sandbox_provisioner:ro
      - ./.env:/app/.env
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/uv.lock:/app/uv.lock
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      HOST_IP: ${HOST_IP:-}
      LITE_MODE: ${LITE_MODE:-false}
      RUNNING_IN_DOCKER: "true"
      YUXI_ENV: ${YUXI_ENV:-development}
      YUXI_DEV_SKILL_LINK: ${YUXI_DEV_SKILL_LINK:-true}
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-yuxi}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: python -m server.worker_dev
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys; from redis import Redis; sys.exit(not Redis.from_url(os.environ['REDIS_URL']).exists('arq:queue:health-check'))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      sandbox-provisioner:
        condition: service_healthy
      xhs-browser-gateway:
        condition: service_healthy
