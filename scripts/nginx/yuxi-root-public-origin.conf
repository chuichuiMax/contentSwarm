# Include inside the /share/case/ and /api/ locations of the root-domain TLS entry.
# Keep each location's existing proxy_pass; this file does not select an upstream.
# The internal HTTP proxy must preserve these values instead of replacing them.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Prefix "";
