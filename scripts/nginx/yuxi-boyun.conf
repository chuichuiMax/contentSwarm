# 宝塔 Nginx 扩展：/www/server/panel/vhost/nginx/extension/47.110.157.215/yuxi-boyun.conf

# 此扩展需同时包含在 HTTP 与 HTTPS 虚拟主机中。生产入口一律跳转 HTTPS，
# 防止运营平台登录凭据和小红书远程画面通过明文链路传输。
if ($scheme != "https") {
    return 308 https://$host$request_uri;
}

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 兼容未带 /boyun 前缀的旧资源路径（浏览器缓存、外链等）
location ^~ /assets/ {
    return 302 /boyun$request_uri;
}

location ^~ /public/ {
    return 302 /boyun$request_uri;
}

location = /favicon.ico {
    return 302 /boyun/favicon.png;
}

location ^~ /boyun/api/ {
    proxy_pass http://127.0.0.1:8090/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 600;
    proxy_send_timeout 600;
}

location ^~ /boyun/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
